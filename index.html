<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aphrodite YVN Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7f6;
            color: #333333;
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .lang-switch button {
            background: #e1e4e8;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-left: 5px;
        }
        .card {
            background: #ffffff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 15px;
        }
        h2 {
            font-size: 18px;
            margin-top: 0;
            color: #2c3e50;
            text-align: center;
        }
        p {
            font-size: 14px;
            line-height: 1.4;
        }
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }
        .btn-full {
            grid-column: span 2;
        }
        .menu-btn {
            background: #ffffff;
            border: 1px solid #e1e4e8;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
        }
        .menu-btn:active {
            background: #eaecef;
        }
        .price {
            color: #e74c3c;
            font-weight: bold;
        }
        .back-btn {
            background: #6c757d;
            color: white;
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            cursor: pointer;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <span style="font-weight: bold; font-size: 14px;">Aphrodite YVN</span>
        <div class="lang-switch">
            <button onclick="setLang('am')">🇦🇲</button>
            <button onclick="setLang('ru')">🇷🇺</button>
            <button onclick="setLang('en')">🇬🇧</button>
        </div>
    </div>

    <!-- 1. Հիմնական էջ / Welcome -->
    <div id="screen-home" class="card">
        <p id="welcome-text" style="text-align: center; white-space: pre-line;"></p>
        <button class="menu-btn btn-full" style="background: #2ea44f; color: white;" onclick="showScreen('screen-region')" id="btn-buy-text"></button>
    </div>

    <!-- 2. Մարզերի / Երևանի ընտրություն -->
    <div id="screen-region" class="card hidden">
        <h2 id="title-region"></h2>
        <div class="btn-grid">
            <button class="menu-btn btn-full" onclick="showScreen('screen-districts')" id="btn-yerevan"></button>
            <button class="menu-btn btn-full" onclick="alert(currentLang === 'ru' ? '❌ Извините, в данный момент в областях товар распродан.' : currentLang === 'en' ? '❌ Sorry, items in provinces are currently sold out.' : '❌ Կներեք, տվյալ պահին մարզերում ապրանքները սպառված են։')" id="btn-provinces"></button>
        </div>
        <button class="back-btn" onclick="showScreen('screen-home')" id="btn-back-1"></button>
    </div>

    <!-- 3. Վարչական շրջաններ -->
    <div id="screen-districts" class="card hidden">
        <h2 id="title-districts"></h2>
        <div class="btn-grid">
            <button class="menu-btn" onclick="selectDistrict('3-րդ մաս')">3-րդ մաս ✅</button>
            <button class="menu-btn" onclick="selectDistrict('Չարբախ')">Չարբախ ✅</button>
            <button class="menu-btn" onclick="selectDistrict('Շենգավիթ')">Շենգավիթ ✅</button>
            <button class="menu-btn" onclick="selectDistrict('Էրեբունի')">Էրեբունի ✅</button>
            <button class="menu-btn" onclick="selectDistrict('Կենտրոն')">Կենտրոն ✅</button>
            <button class="menu-btn" onclick="selectDistrict('Կոմիտաս')">Կոմիտաս ✅</button>
        </div>
        <button class="back-btn" onclick="showScreen('screen-region')" id="btn-back-2"></button>
    </div>

    <!-- 4. Ապրանքատեսակներ -->
    <div id="screen-types" class="card hidden">
        <h2 id="title-types"></h2>
        <div class="btn-grid">
            <button class="menu-btn btn-full" onclick="selectType('🪨 Բազալտ / Basalt', 'basalt')">🪨 Բազալտ ✅</button>
            <button class="menu-btn btn-full" onclick="selectType('🌿 Ֆնդ / Fnd', 'fnd')">🌿 Ֆնդ ✅</button>
            <button class="menu-btn btn-full" onclick="selectType('🍫 Շոկո / Shoko', 'shoko')">🍫 Շոկո ✅</button>
        </div>
        <button class="back-btn" onclick="showScreen('screen-districts')" id="btn-back-3"></button>
    </div>

    <!-- 5. Քաշեր և գներ -->
    <div id="screen-weights" class="card hidden">
        <h2 id="title-weights"></h2>
        <div id="weights-container" class="btn-grid"></div>
        <button class="back-btn" onclick="showScreen('screen-types')" id="btn-back-4"></button>
    </div>

    <!-- 6. Վճարում -->
    <div id="screen-payment" class="card hidden">
        <h2 id="title-payment"></h2>
        <p id="selected-info" style="text-align: center; font-weight: bold;"></p>
        <div class="btn-grid">
            <button class="menu-btn btn-full" onclick="showPaymentDetails('dash')">🪙 Dash Wallet</button>
            <button class="menu-btn" onclick="showPaymentDetails('telcell')">🟩 Telcell</button>
            <button class="menu-btn" onclick="showPaymentDetails('easypay')">🟧 EasyPay</button>
        </div>
        <button class="back-btn" onclick="showScreen('screen-weights')" id="btn-back-5"></button>
    </div>

    <!-- 7. Վճարման տվյալներ -->
    <div id="screen-pay-details" class="card hidden">
        <h2 id="title-pay-details"></h2>
        <p id="pay-instructions" style="white-space: pre-line; background: #eee; padding: 10px; border-radius: 6px;"></p>
        <button class="menu-btn btn-full" style="background: #2ea44f; color: white; margin-top: 10px;" onclick="window.open('https://t.me/Aphrodite_market')">💬 Support (@Aphrodite_market)</button>
        <button class="back-btn" onclick="showScreen('screen-payment')" id="btn-back-6"></button>
    </div>
</div>

<script>
    let currentLang = 'am';
    let selectedData = { district: '', type: '', weight: '', price: '' };

    const texts = {
        am: {
            welcome: "Բարեւ ձեզ հարգելի 🔻🔻հաճախորդներ ուզում եմ ձեզ տեղեկացնել որ մեր միակ պաշտոնական բոտը սա է🔻🔻\n💎սիրով պատրաստ ենք ձեզ տրամադրել ձեր ուզած քաշի ու տեսակի պահոցը արագ և ապահով✅",
            buy: "🛒 Գնել",
            region: "📍 Ընտրեք մարզը կամ քաղաքը:",
            yerevan: "🏙 Երևան",
            provinces: "🏞 Մարզեր",
            districts: "📍 Ընտրեք վարչական շրջանը:",
            types: "📍 Ընտրեք տեսականին:",
            weights: "⚙️ Ընտրեք չափը / քաշը:",
            payment: "💳 Ընտրեք վճարման եղանակը:",
            back: "⬅️ Հետ",
            dashText: "<b>Սպասում վճարում...</b>\n\n💳 Գումար: <b>{price}</b>\n📩 Հասցե (Dash): <code>Xiu7UWmMs4htPq2fX4Lb5vsVG6JoUZzfmy</code>\n\n⏳ Վճարելուց հետո ուղարկեք կտրոնը սուպորտին ✅",
            telcellText: "🟩 <b>Telcell Wallet</b>\n<code>055513545</code>\n\n💰 Գումար: <b>{price}</b>",
            easypayText: "🟧 <b>Easy Wallet</b>\n<code>095061193</code>\n\n💰 Գումար: <b>{price}</b>"
        },buy: "🛒 Купить",
            region: "📍 Выберите регион или город:",
            yerevan: "🏙 Ереван",
            provinces: "🏞 Области",
            districts: "📍 Выберите административный район:",
            types: "📍 Выберите ассортимент:",
            weights: "⚙️ Выберите размер / вес:",
            payment: "💳 Выберите способ оплаты:",
            back: "⬅️ Назад",
            dashText: "<b>Ожидание оплаты...</b>\n\n💳 Сумма: <b>{price}</b>\n📩 Адрес (Dash): <code>Xiu7UWmMs4htPq2fX4Lb5vsVG6JoUZzfmy</code>\n\n⏳ После оплаты отправьте чек в поддержку ✅",
            telcellText: "🟩 <b>Telcell Wallet</b>\n<code>055513545</code>\n\n💰 Сумма: <b>{price}</b>",
            easypayText: "🟧 <b>Easy Wallet</b>\n<code>095061193</code>\n\n💰 Сумма: <b>{price}</b>"
        },
        en: {
            welcome: "Hello dear 🔻🔻customers, we want to inform you that this is our only official bot 🔻🔻\n💎We are happy to provide you with the desired weight and type of stash quickly and securely✅",
            buy: "🛒 Buy",
            region: "📍 Select region or city:",
            yerevan: "🏙 Yerevan",
            provinces: "🏞 Provinces",
            districts: "📍 Select district:",
            types: "📍 Select category:",
            weights: "⚙️ Select size / weight:",
            payment: "💳 Select payment method:",
            back: "⬅️ Back",
            dashText: "<b>Waiting for payment...</b>\n\n💳 Amount: <b>{price}</b>\n📩 Address (Dash): <code>Xiu7UWmMs4htPq2fX4Lb5vsVG6JoUZzfmy</code>\n\n⏳ After payment, send receipt to support ✅",
            telcellText: "🟩 <b>Telcell Wallet</b>\n<code>055513545</code>\n\n💰 Amount: <b>{price}</b>",
            easypayText: "🟧 <b>Easy Wallet</b>\n<code>095061193</code>\n\n💰 Amount: <b>{price}</b>"
        }
    };

    const weightsData = {
        basalt: [
            { name: "0.1", price: "18.0 $" },
            { name: "0.2", price: "35.0 $" },
            { name: "0.3", price: "45.0 $" },
            { name: "0.5", price: "55.0 $" },
            { name: "1.0", price: "85.0 $" }
        ],
        fnd: [
            { name: "0.5", price: "23.0 $" },
            { name: "1.0", price: "35.0 $" },
            { name: "2.0", price: "47.0 $" }
        ],
        shoko: [
            { name: "0.5", price: "20.0 $" },
            { name: "1.0", price: "39.0 $" }
        ]
    };

    function setLang(lang) {
        currentLang = lang;
        updateTexts();
    }

    function updateTexts() {
        let t = texts[currentLang];
        document.getElementById('welcome-text').innerText = t.welcome;
        document.getElementById('btn-buy-text').innerText = t.buy;
        document.getElementById('title-region').innerText = t.region;
        document.getElementById('btn-yerevan').innerText = t.yerevan;
        document.getElementById('btn-provinces').innerText = t.provinces;
        document.getElementById('title-districts').innerText = t.districts;
        document.getElementById('title-types').innerText = t.types;
        document.getElementById('title-weights').innerText = t.weights;
        document.getElementById('title-payment').innerText = t.payment;

        ['btn-back-1', 'btn-back-2', 'btn-back-3', 'btn-back-4', 'btn-back-5', 'btn-back-6'].forEach(id => {
            document.getElementById(id).innerText = t.back;
        });
    }

    function showScreen(screenId) {
        document.querySelectorAll('.card').forEach(el => el.classList.add('hidden'));
        document.getElementById(screenId).classList.remove('hidden');
    }

    function selectDistrict(district) {
        selectedData.district = district;
        showScreen('screen-types');
    }

    function selectType(typeName, typeKey) {
        selectedData.type = typeName;
        let container = document.getElementById('weights-container');
        container.innerHTML = '';
        
        weightsData[typeKey].forEach(item => {
            let btn = document.createElement('button');
            btn.className = 'menu-btn';
            btn.innerHTML = ⚖️ ${item.name} - <span class="price">${item.price}</span>;
            btn.onclick = () => selectWeight(item.name, item.price);
            container.appendChild(btn);
        });
        showScreen('screen-weights');
    }

    function selectWeight(weight, price) {
        selectedData.weight = weight;
        selectedData.price = price;
        document.getElementById('selected-info').innerText = ${selectedData.type} (${weight}) - ${price};
        showScreen('screen-payment');
    }

    function showPaymentDetails(method) {
        let t = texts[currentLang];
        let infoEl = document.getElementById('pay-instructions');
        if (method === 'dash') {
            infoEl.innerHTML = t.dashText.replace('{price}', selectedData.price);
        } else if (method === 'telcell') {
            infoEl.innerHTML = t.telcellText.replace('{price}', selectedData.price);
        } else if (method === 'easypay') {
            infoEl.innerHTML = t.easypayText.replace('{price}', selectedData.price);
        }
        showScreen('screen-pay-details');
    }

    updateTexts();
</script>

</body>
</html>
