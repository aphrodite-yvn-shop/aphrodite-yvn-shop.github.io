<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aphrodite YVN Shop</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding-bottom: 90px;
      font-family: system-ui, sans-serif;
      background: #18222d;
      color: white;
    }
    header {
      padding: 18px 12px;
      text-align: center;
      background: linear-gradient(135deg, #2ea6ff, #1882d2);
    }
    header h2 { margin: 0; font-size: 20px; }
    header p { margin: 6px 0 0; font-size: 13px; }
    #grid {
      max-width: 480px;
      margin: auto;
      padding: 12px;
    }
    .card {
      background: #242f3d;
      padding: 14px;
      margin-bottom: 12px;
      border-radius: 12px;
    }
    .name { color: #2ea6ff; font-weight: 700; margin-bottom: 12px; }
    .item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 0;
      border-bottom: 1px solid #ffffff18;
    }
    .item:last-child { border-bottom: 0; }
    .price { white-space: nowrap; font-weight: 700; }
    button {
      border: 0;
      border-radius: 7px;
      padding: 9px 12px;
      color: white;
      background: #168edb;
      font-weight: 600;
      cursor: pointer;
    }
    button:active { opacity: .7; }
    .qty { display: flex; align-items: center; gap: 8px; }
    .qty button { padding: 5px 10px; }
    #bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px;
      background: #1e2c3a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-shadow: 0 -3px 12px #0005;
    }
    #order { background: #2ea6ff; }
    #error { padding: 12px; color: #ffbdbd; }
  </style>
</head>
<body>
  <header>
    <h2>Aphrodite YVN Shop</h2>
    <p>Ընտրեք ապրանքը և քանակը</p>
  </header>

  <main id="grid">
    <p>Ապրանքները բեռնվում են...</p>
  </main>
  <div id="error" role="status"></div>

  <footer id="bar">
    <div>Ընդամենը՝ <b id="total">0 ֏</b></div>
    <button id="order" type="button">Կապվել Telegram-ով</button>
  </footer>

  <script>
    "use strict";

    // Փոխարինիր այս օրինակները քո օրինական ապրանքներով։
    const PRODUCTS = [
      { id: "item1", name: "Ապրանք 1", price: 1000 },
      { id: "item2", name: "Ապրանք 2", price: 2000 }
    ];

    const OWNER = "YOUR_TELEGRAM_USERNAME";
    const cart = {};
    const grid = document.getElementById("grid");
    const totalEl = document.getElementById("total");
    const errorEl = document.getElementById("error");

    const money = n => n.toLocaleString("hy-AM") + " ֏";

    function render() {
      grid.replaceChildren();

      PRODUCTS.forEach(product => {
        const card = document.createElement("section");
        card.className = "card";

        const title = document.createElement("div");
        title.className = "name";
        title.textContent = product.name;
        card.appendChild(title);

        const row = document.createElement("div");
        row.className = "item";

        const price = document.createElement("span");
        price.className = "price";
        price.textContent = money(product.price);

        const controls = document.createElement("div");
        controls.className = "qty";

        const minus = document.createElement("button");
        minus.type = "button";
        minus.textContent = "−";
        minus.setAttribute("aria-label", "Նվազեցնել");
        minus.addEventListener("click", () => changeQty(product.id, -1));

        const count = document.createElement("span");
        count.textContent = String(cart[product.id] || 0);

        const plus = document.createElement("button");
        plus.type = "button";
        plus.textContent = "+";
        plus.setAttribute("aria-label", "Ավելացնել");
        plus.addEventListener("click", () => changeQty(product.id, 1));

        controls.append(minus, count, plus);
        row.append(price, controls);
        card.appendChild(row);
        grid.appendChild(card);
      });

      updateTotal();
    }

    function changeQty(id, delta) {
      cart[id] = Math.max(0, (cart[id] || 0) + delta);
      render();
    }

    function updateTotal() {
      const total = PRODUCTS.reduce(
        (sum, p) => sum + p.price * (cart[p.id] || 0), 0
      );
      totalEl.textContent = money(total);
    }

    document.getElementById("order").addEventListener("click", () => {
      const selected = PRODUCTS.filter(p => (cart[p.id] || 0) > 0);

      if (!selected.length) {
        errorEl.textContent = "Նախ ընտրեք առնվազն մեկ ապրանք։";
        return;
      }

      if (!/^[A-Za-z0-9_]{5,32}$/.test(OWNER) ||
          OWNER === "YOUR_TELEGRAM_USERNAME") {
        errorEl.textContent =
          "Կոդում նշեք ձեր Telegram օգտանունը՝ OWNER փոփոխականում։";
        return;
      }

      const lines = selected.map(
        p => ${p.name} × ${cart[p.id]} — ${money(p.price * cart[p.id])}
      );
      const total = selected.reduce(
        (sum, p) => sum + p.price * cart[p.id], 0
      );
      const message = "Բարև։ Հետաքրքրված եմ հետևյալ ապրանքներով։\n\n" +
        lines.join("\n") + "\n\nԸնդամենը՝ " + money(total);

      const url = "https://t.me/" + OWNER + "?text=" +
        encodeURIComponent(message);

      const tg = window.Telegram && window.Telegram.WebApp;
      if (tg && typeof tg.openTelegramLink === "function") {
        tg.openTelegramLink(url);
      } else {
        window.open(url, "_blank", "noopener,noreferrer");
      }
    });

    try {
      const tg = window.Telegram && window.Telegram.WebApp;
      if (tg) {
        tg.ready();
        tg.expand();
      }
      render();
    } catch (e) {
      errorEl.textContent = "Էջի բեռնման սխալ։ Թարմացրեք էջը։";
      console.error(e);
    }
  </script>
</body>
</html>
